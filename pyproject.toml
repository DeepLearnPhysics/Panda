[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panda"
version = "1.0.0"
description = "Reusable sensor-level representations for LArTPC point clouds"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Samuel Young", email = "youngsam@stanford.edu" },
]
dependencies = [
    "addict",
    "h5py",
    "huggingface-hub",
    "numpy<=1.26.4",
    "scipy",
    "spconv-cu126",
    "torch>=2.5",
]

[project.optional-dependencies]
flash = [
    "torch @ https://download-r2.pytorch.org/whl/cu126/torch-2.10.0%2Bcu126-cp310-cp310-manylinux_2_28_x86_64.whl",
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3%2Bcu126torch2.10-cp310-cp310-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl",
]

[dependency-groups]
demo = [
    "ipykernel",
    "jupyter",
    "matplotlib",
    "plotly",
    "scikit-learn",
    "tqdm",
]
dev = [
    "pandas",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["panda"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.11.1"
exclude-newer = "7 days"
default-groups = ["demo"]
concurrent-builds = 1
cache-keys = [
    { file = "pyproject.toml" },
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: requires a CUDA-capable GPU and CUDA runtime",
]
