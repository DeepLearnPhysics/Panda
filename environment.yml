name: panda
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.10.0+cu126
      - torchvision==0.25.0
      - torchaudio==2.10.0+cu126
      - flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3%2Bcu126torch2.10-cp310-cp310-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl
      - spconv-cu126
      - numpy<=1.26.4
      - scipy
      - addict
      - huggingface-hub
      - matplotlib
      - h5py
      - plotly
      - scikit-learn
      - tqdm
      - jupyter
      - ipykernel
      - .
variables:
  PYTHONNOUSERSITE: "1"
